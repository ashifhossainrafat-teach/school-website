<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ঝাঁপা মাধ্যমিক আদর্শ বালিকা বিদ্যালয়</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f7fff9;
  color:#222;
  line-height:1.7;
}

header{
  background:#006a3d;
  color:white;
  padding:15px 5%;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:5px solid #d90429;
}

.logo{
  width:78px;
  height:78px;
  background:white;
  border-radius:50%;
  object-fit:contain;
  padding:4px;
}

header h1{
  font-size:23px;
}

header p{
  font-size:14px;
  opacity:.95;
}

nav{
  background:white;
  padding:11px 8px;
  text-align:center;
  box-shadow:0 2px 8px #0002;
  position:sticky;
  top:0;
  z-index:100;
}

nav a{
  color:#006a3d;
  text-decoration:none;
  font-weight:bold;
  margin:0 7px;
  font-size:14px;
}

nav a:hover{
  color:#d90429;
}

.hero{
  min-height:390px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
  background:
    linear-gradient(#006a3dcc,#006a3dcc),
    url("school1.jpg") center/cover;
  color:white;
}

.hero h2{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:10px 22px;
  background:#d90429;
  color:white;
  text-decoration:none;
  border-radius:25px;
  font-weight:bold;
}

section{
  max-width:1100px;
  margin:auto;
  padding:50px 20px;
}

.title{
  text-align:center;
  color:#006a3d;
  margin-bottom:28px;
  font-size:29px;
}

.title::after{
  content:"";
  display:block;
  width:60px;
  height:4px;
  background:#d90429;
  margin:8px auto;
  border-radius:5px;
}

.about{
  background:white;
  border-radius:15px;
  padding:27px;
  box-shadow:0 3px 12px #0001;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
  border-top:4px solid #006a3d;
}

.card h3{
  color:#006a3d;
  margin-bottom:8px;
}

.card a{
  color:#d90429;
  font-weight:bold;
  text-decoration:none;
}

.card a:hover{
  text-decoration:underline;
}

/* Gallery */

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.gallery-item{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
}

.gallery img{
  width:100%;
  height:230px;
  object-fit:cover;
  display:block;
  transition:.3s;
}

.gallery img:hover{
  transform:scale(1.03);
}

.gallery-caption{
  padding:13px;
}

.gallery-caption b{
  color:#006a3d;
}

/* Teacher */

.teacher-img{
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

/* Achievement */

.achievement-img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

/* Loading */

.loading{
  text-align:center;
  padding:25px;
  color:#006a3d;
  font-weight:bold;
}

.error{
  text-align:center;
  padding:20px;
  color:#d90429;
  font-weight:bold;
}

.empty{
  text-align:center;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
}

/* Footer */

footer{
  background:#006a3d;
  color:white;
  text-align:center;
  padding:27px 15px;
  border-top:5px solid #d90429;
}

footer p{
  margin:4px;
}

/* Mobile */

  header{
    padding:12px 4%;
  }

  header h1{
    font-size:17px;
  }

  header p{
    font-size:11px;
  }

  .logo{
    width:60
